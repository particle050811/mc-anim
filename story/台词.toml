# 台词表：说出口的每一句（不用旁白）。段.ts 的声音 cue 写 { 帧, 台词: '<台词 id>' } 引用，sr check 核对。
# 每条 [["台词"]]：
#   id        <章>-<角色>-<短名>，章内唯一，和段解耦；不撞 docs/旧名.tsv 里的旧台词 id
#   角色      和 id 中间那段一致
#   文本      屏幕上、配音里的字
#   配音      成品的资产 id（配音/<id>）；还没配音的不写
#   文本哈希  配音时文本的 sha256 前 12 位；文本改了对不上，就是配音过期
#   成品sha   配音成品的 sha256 前 12 位，要和资产锁一致；换了配音不改这里就报
#   口型、口型手修  { "成品sha" = … }：口型数据和手修是对着哪版成品做的，配音一换就报过期
#   未用      true = 不被任何段用（留着备用）；没写的每句恰好被一段用到
#   说明      可选
# 中文键要加引号（TOML 1.0 的裸键只认 ASCII）。第 6、7 章的台词随场搬迁时登记（旧 参考模型库/src/配音/台词表.json，旧 id 换新 id 见 docs/旧名.tsv）。
