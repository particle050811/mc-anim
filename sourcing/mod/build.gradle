plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = '0.1.0'
group = 'mcai'
base { archivesName = 'mcai' }

// 直接用运行 gradle 的那个 JDK（mcai build 把 JAVA_HOME 指到 MCAI_JAVA_HOME 给的 JDK 17），不让 gradle 自己去下载工具链
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

minecraft {
    // 官方 Mojmap，和游戏实例的 Forge 版本保持一致
    mappings channel: 'official', version: '1.20.1'
}

mixin {
    add sourceSets.main, 'mcai.refmap.json'
    config 'mcai.mixins.json'
}

def mcaiGame() {
    def g = System.getenv('MCAI_GAME')
    if (!g) throw new GradleException('要设环境变量 MCAI_GAME：游戏环境目录（里面有 取材服务端/mods/）')
    return g
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // 暮色地标网格的 mixin 要引用暮色的类（TFLandmark、XZQuadrantIterator 等）；只编译时用，游戏里用实例自己装的那份。
    // 用取材服务端里的 jar（和实例同一版），不另外下载；游戏环境目录由环境变量 MCAI_GAME 给（anim、mcai build 会传）
    compileOnly files(mcaiGame() + '/取材服务端/mods/twilightforest-1.20.1-4.3.2508-universal.jar')
}

tasks.named('jar', Jar).configure {
    // 实例里跑的是 SRG 名，必须重混淆
    finalizedBy 'reobfJar'
}

// 可复现打包：同一份源码两次构建，jar 逐字节一样（条目不带文件时间、按固定顺序），取材产物的头里记源码提交就能对上是哪一版
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// 源码版本写进 jar（mcai-source.txt，网格头的「mcai 源码」读它）：只看 sourcing/mod 这个目录最后一次提交，仓库别处改了不影响；
// 这个目录有没提交的改动就加 -dirty。没有 git（比如从压缩包构建）写 unknown
def mcaiSource() {
    def git = { List<String> a ->
        try {
            def p = (['git', '-C', projectDir.absolutePath] + a).execute()
            def out = p.text.trim()
            return p.waitFor() == 0 ? out : null
        } catch (Exception ignored) {
            return null
        }
    }
    def commit = git(['log', '-1', '--format=%H', '--', '.'])
    if (!commit) return 'unknown'
    def describe = git(['describe', '--always', '--abbrev=12', commit]) ?: commit.take(12)
    def dirty = git(['status', '--porcelain', '--', '.'])
    return describe + (dirty ? '-dirty' : '')
}

def generatedRes = layout.buildDirectory.dir('generated/mcai-source')
def writeMcaiSource = tasks.register('writeMcaiSource') {
    def out = generatedRes.get().file('mcai-source.txt').asFile
    outputs.file(out)
    // 每次都重算（提交、改动不是 gradle 能看见的输入）；内容没变就不重写，jar 不跟着重打
    outputs.upToDateWhen { false }
    doLast {
        def v = mcaiSource() + '\n'
        if (!out.exists() || out.getText('UTF-8') != v) {
            out.parentFile.mkdirs()
            out.setText(v, 'UTF-8')
        }
    }
}
sourceSets.main.resources.srcDir(files(generatedRes).builtBy(writeMcaiSource))

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// test/twilight-grid-test.sh 用：运行时要的库（脚本把其中 Mojmap 名的 Forge 换成 SRG 名那份，好和重混淆后的 jar 对上）
tasks.register('printRuntimeClasspath') {
    doLast { println configurations.runtimeClasspath.asPath }
}
