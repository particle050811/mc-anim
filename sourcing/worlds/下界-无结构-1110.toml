# 世界声明：下界-无结构-1110，作品「亚波伦不放水」封面、正片背景用的真实下界地形（用户 11-10 定：不编假地形，直接导入真实的；视距起码 32 区块）。
# 群系照原版生成：不套 large_biomes，不放任何放大群系的数据包（用户 11-10 定：「原来那个扩大化的设置是 4x 生物群系，没有必要搞，还是就用原版生物群系好了」）。
# 结构不生成（用户 11-10 定：「不要有下界堡垒、堡垒遗迹什么的……你也可以关掉生成不就好了」）：前一版 下界-原版-1110 开着结构，正片场地旁边切到一座下界堡垒，废了；
# 那份存档 11-15 清理数据根时删了（用户定），声明和包的登记早就删了。同一个种子，关掉结构后噪声地形（岩壁、熔岩海）不变。
# 服务端用现成的 取材服务端（eula 已同意的目录），它 mods/ 里的模组都会加载，所以不是纯原版生成：群系分布、噪声地形是原版的，
# 模组往下界加的地物（机械动力的岩层、夸克的尖柱等，不算结构，关不掉）会混进来，烘出来有多少见 包的 缺失.tsv 和 docs/世界.md「有顶的维度」。要纯原版得另装一个只有 Forge 的服务端（eula 要人同意）。

"displayName" = "下界-无结构-1110"
"server" = "取材服务端"
"dimension" = "minecraft:the_nether"
"seed" = 1110
"generateStructures" = false                       # 用户 11-10 定；anim world new 写进 server.properties，只在建存档时读一次
"Forge" = "1.20.1-47.4.10"
# 照 取材服务端/mods/ 现有的列（和 暮色放大-1752 同一套）；数据包一个不放
"mods" = ["twilightforest", "create", "iceandfire", "tconstruct", "mantle", "quark", "zeta", "touhoulittlemaid", "mcai"]
"extraModFiles" = ["citadel-2.6.3-1.20.1.jar"]

[["pregen"."tile"]]
"name" = "全片"
"corners" = [-2048, -2048, 2048, 2048]
"basis" = "挑点用的范围，和前一版一样（66049 个区块，约 8 分钟）。建好后在存档里数过：整片没有一格下界砖块（堡垒）、磨制黑石砖和镶金黑石（堡垒遗迹）、哭泣的黑曜石（废弃传送门）"

# 选定的点（用户 11-10 定：场地找一处天然的高处，不用整平；空中点离下面至少 30 格、头顶有余量、四周尽量远）。都在下界荒地里（地面是下界岩）：
#   正片场地 中心 (898, 50, -300)（脚的高度，地面方块顶 y 49）：熔岩海东岸的一块下界岩台地，高出熔岩面 18 格，x 884～926、z -314～-276 天然就近乎平（脚 y 49～53，西低东高），
#     头顶净高 58 格，往西、往北俯瞰熔岩海。不整平；编辑层只把地面露着的机械动力熔渣岩换成下界岩（下界-无结构-1110.编辑.toml）。前一版就是在这里整平的，旁边的堡垒现在不生成了。
#   备选场地 (1014, 82, -390)：东边 130 格的一座山头，高出熔岩面 50 格、四周平均低 29 格，但头顶净高只有 32 格、看不到多少熔岩。
#   封面空中点 (824, 66, -352)：场地西边的熔岩海上空，熔岩面 y 31（离 34 格），头顶岩顶 y 108（余 42 格）；32 个方向平均望出 152 格、最短 91 格。和前一版同一个点（同种子地形没变）。
# 包的范围按视距算（用户 11-16「烘焙范围按视距算」）：镜头走过的范围外扩远雾的 D（作品/亚波伦不放水/地点/真下界.tsx 的 netherBrighter，用户 11-16 定 D 1000）。
#   正片各幕的人（11-16 按 场/1-台地/编排-开盘.ts、编排-齐放.ts 逐 0.05 秒取）在 x 894～908、z -304～-288，机位离人最远约 22 格（4-齐放 侧拍），
#   算成 x 869～933、z -330～-263；核对段另有封面空中点 (824, -352)、备选场地 (1014, -390)。外扩 1000：x -176～2014、z -1390～737，
#   区域 RX -1～3、RZ -3～1（x -512～2047、z -1536～1023，25 个），存档里都生成过（RX -4～3、RZ -4～3），不用预生成。
["bake"]
"origin" = [0, 0, 0]
"fill" = "minecraft:netherrack"         # 可见变换换埋住的格用（说明见 主世界-116.toml）：这个包状态表里没有石头
"glowFirst" = true                      # 粗级合并时露在外面的熔岩、火、萤石优先（pipeline/世界/烘焙/合并.ts），远处不被合成地狱岩（用户 11-16：远处的火焰和熔岩怎么不发光）

[["bake"."faithful"]]
"name" = "祭坛底"
"boxes" = [895, -303, 901, -297]
"provenance" = "作品/亚波伦不放水/地点/地形改动.ts 祭坛底挖"

[["bake"."pack"]]
"name" = "下界-无结构-1110"
"region" = { "RX" = [-1, 3], "RZ" = [-3, 1] }
"source" = "取材服务端 下界-无结构-1110 存档的下界 RX -1～3、RZ -3～1，套编辑层（场地一带的模组岩层换成下界岩，地形不动），anim world bake 烘焙（全高）"
