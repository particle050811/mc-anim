# 世界声明：主世界-116（种子 116、生成时修整的正式主世界），第 6 章飞越主世界、边城的地形从这个世界烘焙（字段见 docs/世界.md）。
# 数值照旧项目 参考模型库/工具/游戏取材/主世界范围.py（岛、边城、航线三批，用户 10-05 定）和 package.json「导入:主世界116」。
# 旧导入读的是三批碰到的区域文件号的外接矩形（主世界范围.py 区域 岛 边城 航线 → RX 11～82、RZ -20～2）里有的区域文件，一个矩形就够。
# 10-30 用 anim world bake 重烘（矩形里 702 个区域文件，读存档 137 秒、烘焙 655 秒），目录指纹和当时登记的 9cd3fdcf8361 一样；现在登记的 43b681414058 是它转码来的。

"displayName" = "主世界-116"
"server" = "取材服务端-主世界"
"dimension" = "minecraft:overworld"
"seed" = 116
"Forge" = "1.20.1-47.4.10"
"generateStructures" = false                       # 主世界取材结构全禁（取材服务端.py --no-structures，用户 10-04 定）；anim world new 写进 server.properties
# 照 取材服务端-主世界/mods/ 和世界 datapacks/ 列的，和 测试-修整-种子116 同一套；建世界时是不是正好这一套没核过
"mods" = ["twilightforest", "create", "iceandfire", "citadel", "tconstruct", "mantle", "quark", "zeta", "touhoulittlemaid", "mcai"]
"datapacks" = ["通用/不生成龙巢", "主世界修整", "只给主世界/主世界不生成人造地物", "epicterrain_compatible1.20.zip"]

[["pregen"."tile"]]
"name" = "岛"
"center" = [39680, -1216]
"halfSide" = [2560, 2560]
"basis" = "主世界范围.py 岛：基地窗外、6-1-1、6-2-4"

[["pregen"."tile"]]
"name" = "边城"
"center" = [8960, -5376]
"halfSide" = [3072, 3072]
"basis" = "主世界范围.py 边城：6-2-6 末尾、6-3 从 2100 米落进城里"

# 航线：岛 → 转弯点 → 边城两侧各 1536 米的区块，去掉前两批已经盖住的（Chunky csv 图案，区块列表和旧项目 主世界范围.py csv 逐行一样）。
# 更远的地形由远景包（离线高度图）兜底，不用游戏生成
[["pregen"."tile"]]
"name" = "航线"
"polyline" = [[39680, -1216], [20438, -8567], [8960, -5376]]
"halfWidth" = 1536
"exclude" = ["岛", "边城"]
"basis" = "主世界范围.py 航线：6-2-5 飞越主世界、6-2-6；转弯点和边城中心用户 10-05 定"

# 场景原点取在航线中段（岛和边城之间），两头离原点都在 16 km 以内，float32 误差在毫米级（主世界范围.py PACK_ORIGIN）
["bake"]
"origin" = [24576, 64, -4096]

# 可见变换（docs/世界.md「可见变换」）：埋住看不见的格换成 填充（默认 minecraft:stone），封死的腔填实。渲染时会挖开、整平的地方
