# 世界声明：暮色放大-1752，第 1 场（暮色森林）的远景地形从这个世界烘焙（字段见 docs/世界.md）。数值照旧项目
# 参考模型库/工具/游戏取材/暮色范围.py 和 sourcing/mod/MANUAL.md「新建放大 4 倍的世界」。没在全新环境里按这份从头生成核对过；
# 拿现在的存档 anim world bake 暮色放大-1752，烘出的 暮色放大-1752-扩展 和登记的版本 b29dfba0d167 一样（10-30 核过）。

"名称" = "暮色放大-1752"
"服务端" = "取材服务端"                    # 游戏环境（ANIM_GAME）下的服务端目录
"维度" = "twilightforest:twilight_forest"
"种子" = 1752
"Forge" = "1.20.1-47.4.10"

# 生成时装的模组：写 sourcing/jars.toml 里的 id。照现在 取材服务端/mods/ 列的，当年生成时是不是正好这一套没核过
# （citadel-2.6.3 是冰火的前置，还没登记进 jars.toml）
"模组" = ["twilightforest", "create", "iceandfire", "tconstruct", "mantle", "quark", "zeta", "touhoulittlemaid", "mcai"]
"另需模组文件" = ["citadel-2.6.3-1.20.1.jar"]

# 建世界时放进 <世界>/datapacks/ 的，相对 sourcing/datapacks/（取材服务端.py --new --twilight-x4 会放这两个）
"数据包" = ["通用/不生成龙巢", "暮色放大4倍"]

# 预生成用 Chunky（服务端 预生成模组/Chunky-1.3.146.jar），四块长方形合起来正好是存档里 Status 为 full 的区块。
# 两角、中心、半边是方块坐标；Chunky 把中心对齐到区块、半边向上取整到区块，含两端。
["预生成"]
"区域文件范围" = { "RX" = [-27, 2], "RZ" = [-11, 19] }   # 读存档、烘焙时读的 r.<RX>.<RZ>.mca
"区块数" = 677671

[["预生成"."块"]]
"名" = "原矩形"
"两角" = [-13191, -2887, -935, 7192]   # chunky corners：7 座首领地标的外包框四边各外扩 2 km
"依据" = "MANUAL.md 的预生成命令"

[["预生成"."块"]]
"名" = "北"
"中心" = [-10488, -4120]
"半边" = [3072, 1248]
"依据" = "按区域文件反推（当时的 Chunky 参数没记下），没在服务端上实跑过"

[["预生成"."块"]]
"名" = "南"
"中心" = [-4344, 8472]
"半边" = [5120, 1264]
"依据" = "按区域文件反推（北边从原矩形外一格算起），没在服务端上实跑过"

[["预生成"."块"]]
"名" = "东"
"中心" = [42, 6400]
"半边" = [982, 3072]
"依据" = "Chunky 最后一个任务的记录（config/chunky/tasks/twilight_forest.properties，记录是已取消，范围里的区块全是 full）"

# 烘焙：场景原点要是 2048 的整数倍，暮色 oy = 0（暮色范围.py 原点）。
# 旧项目两个包都读整个存档（package.json「导入:暮色放大1752」「导入:暮色放大1752扩展」），差别在当时存档预生成到哪：
# 暮色放大-1752 是扩展前的存档烘的，现在的存档烘不出来，不声明；正式段用 暮色放大-1752-扩展。
["烘焙"]
"原点" = [-6144, 0, 2048]

[["烘焙"."包"]]
"名" = "暮色放大-1752-扩展"
"来源" = "取材服务端 暮色放大-1752 存档的暮色森林维度（全部区域文件），anim world bake 烘焙"
