# 世界声明：暮色放大-1752，第 1 场（暮色森林）的远景地形从这个世界烘焙（字段见 docs/世界.md）。数值照旧项目
# 参考模型库/工具/游戏取材/暮色范围.py 和 sourcing/mod/MANUAL.md「新建放大 4 倍的世界」。没在全新环境里按这份从头生成核对过；
# 拿现在的存档 anim world bake 暮色放大-1752，烘出的 暮色放大-1752-扩展 和当时登记的版本 b29dfba0d167 一样（10-30 核过）；现在登记的 d85050c74ee2 是它转码来的。

"displayName" = "暮色放大-1752"
"server" = "取材服务端"                    # 游戏环境（ANIM_GAME）下的服务端目录
"dimension" = "twilightforest:twilight_forest"
"seed" = 1752
"Forge" = "1.20.1-47.4.10"

# 生成时装的模组：写 sourcing/jars.toml 里的 id。照现在 取材服务端/mods/ 列的，当年生成时是不是正好这一套没核过
# （citadel-2.6.3 是冰火的前置，还没登记进 jars.toml）
"mods" = ["twilightforest", "create", "iceandfire", "tconstruct", "mantle", "quark", "zeta", "touhoulittlemaid", "mcai"]
"extraModFiles" = ["citadel-2.6.3-1.20.1.jar"]

# 建世界时放进 <世界>/datapacks/ 的，相对 sourcing/datapacks/（取材服务端.py --new --twilight-x4 会放这两个）
"datapacks" = ["通用/不生成龙巢", "暮色放大4倍"]

# 预生成用 Chunky（服务端 预生成模组/Chunky-1.3.146.jar），四块长方形合起来正好是存档里 Status 为 full 的区块。
# 两角、中心、半边是方块坐标；Chunky 把中心对齐到区块、半边向上取整到区块，含两端。
["pregen"]
"regionFileRange" = { "RX" = [-27, 2], "RZ" = [-11, 19] }   # 读存档、烘焙时读的 r.<RX>.<RZ>.mca
"chunkCount" = 677671

[["pregen"."tile"]]
"name" = "原矩形"
"corners" = [-13191, -2887, -935, 7192]   # chunky corners：7 座首领地标的外包框四边各外扩 2 km
"basis" = "MANUAL.md 的预生成命令"

[["pregen"."tile"]]
"name" = "北"
"center" = [-10488, -4120]
"halfSide" = [3072, 1248]
"basis" = "按区域文件反推（当时的 Chunky 参数没记下），没在服务端上实跑过"

[["pregen"."tile"]]
"name" = "南"
"center" = [-4344, 8472]
"halfSide" = [5120, 1264]
"basis" = "按区域文件反推（北边从原矩形外一格算起），没在服务端上实跑过"

[["pregen"."tile"]]
"name" = "东"
"center" = [42, 6400]
"halfSide" = [982, 3072]
"basis" = "Chunky 最后一个任务的记录（config/chunky/tasks/twilight_forest.properties，记录是已取消，范围里的区块全是 full）"

# 烘焙：场景原点要是 2048 的整数倍，暮色 oy = 0（暮色范围.py 原点）。
# 旧项目两个包都读整个存档（package.json「导入:暮色放大1752」「导入:暮色放大1752扩展」），差别在当时存档预生成到哪：
# 包 暮色放大-1752 是扩展前的存档烘的，现在的存档烘不出来，也没有段用，用户 10-31 定从登记表去掉；正式段用 暮色放大-1752-扩展。
["bake"]
"origin" = [-6144, 0, 2048]

