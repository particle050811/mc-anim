# 编辑层示例（写法见 docs/世界.md「编辑层」）：烘焙前按顺序套到存档读出的方块上，存档本身不动。
# 地方：基地小岛中间（地面 y 65～67，长着草）。anim world map 测试-修整-编辑示例 39660 -1260 39750 -1190 看效果，加 --原样 看改之前。

"说明" = "演示：岛中间铺一块石台，上面一间玻璃房，复制一间到东边，北边摆一座石亭"

[["步"]]
"说明" = "清掉台子范围里的草，铺 21×21 的平滑石台（y 66）"
"命令" = """
fill 39690 67 -1230 39710 75 -1210 minecraft:air
fill 39690 66 -1230 39710 66 -1210 minecraft:smooth_stone
"""

[["步"]]
"说明" = "台子上一间空心玻璃房，木地板，中间一盏灯笼"
"命令" = """
fill 39694 67 -1226 39706 72 -1214 minecraft:glass hollow
fill 39695 67 -1225 39705 67 -1215 minecraft:oak_planks
setblock 39700 68 -1220 minecraft:lantern[hanging=false]
"""

[["步"]]
"说明" = "把玻璃房原样复制到东边 26 格（clone 读的是上面几步改完的样子）"
"命令" = "clone 39694 67 -1226 39706 72 -1214 39720 67 -1226"

[["步"]]
"说明" = "北边摆一座 5×5×5 的石亭（structures/示例-石亭.nbt，自己用 NBT 写的原版结构格式），顺时针转 90°：台阶朝东"
"命令" = "place template structures/示例-石亭.nbt 39704 66 -1245 clockwise_90"
