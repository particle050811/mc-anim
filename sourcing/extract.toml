# 取材清单：从游戏和模组 jar 导出资产的唯一一份登记（照旧项目 参考模型库/工具/取材/取材清单.toml 搬来）。jar 登记在 jars.toml。
# 跑：anim extract <名称或组>...；--只打印 只列命令，--检查 查缺的 jar、程序、脚本和库里的字节（--校验 再核 jar 的 sha256），--全部 = 所有有步骤、不用开游戏、不待迁移的条目。
# 每个条目在 <数据根>/run/extract/<名称>/ 这个暂存目录里跑（目录布局照旧项目的 参考模型库/，步骤里的相对路径不用改），
# 跑完按「产物」逐个算 sha256 和资产锁（assets/资产锁.json 并上所选作品的 资产锁.json）比：一样的放进库（库里已有就不动），不一样的报出来、不入库（资产锁只认登记过的那一版）。
# 每条 [["取材"]]：
#   名称      跑的时候用的名字
#   需要      用到的 jar，写 jars.toml 里的 id
#   前置      先要跑哪几条（在同一个暂存目录里先跑，后面的步骤读它们的产物）
#   要开游戏  步骤要连着开着的取材客户端（anim mcai game start 先开），--全部 里不跑
#   待迁移    步骤要的旧项目工具或输入还没搬过来，跑不了；写原因
#   公开版    "提取"：公开版不带这些文件，用户按这条从 jar 提取；"不提取"：后面注明公开版怎么拿到
#   公开版提取  公开版提取时不跑步骤、改用内置做法时写（内置:游戏音效、内置:网格图集）
#   作品      产物登记在这部作品的资产表（<作品根>/资产表/）时写：只在选了这部作品（--作品）时跑、查，别的作品下 --检查 跳过
#   步骤      参数列表，不过 shell，在暂存目录里逐条跑，一条失败就停。第一个参数可以是下面「程序」里的简称，
#             或 python（anim 配置 ANIM_PYTHON）、ts（旧项目的 一镜到底/跑.mjs，待迁移）、mcai（sourcing/mcai/mcai.py，经 anim mcai 同样的环境）、复制（拷一个文件）。
#             参数里 {jar:id[,id]} 换成 jar 路径（逗号连接），{prism数据} 换成 Prism 的数据目录，{脚本} 换成 sourcing/extract/，{作品根} 换成所选作品的根目录；
#             { "输出" = [...] } 是先跑这条命令、把输出按空白拆开填在这里。
#   ["取材"."输入"]  步骤要读的非 jar 文件：资产 id = 暂存目录里的位置，跑之前从资产库拷进去。
#   ["取材"."产物"]  放在条目最后：资产 id = 暂存目录里的文件（相对暂存目录）。
#             id 写成 <id 目录>/* 时指资产锁里这个目录下（一层）的全部 id，文件那边的 * 换成 id 的最后一段。
#   脚本读 ANIM_GAME（游戏环境）、ANIM_JAVA_HOME（javap）、ANIM_MC_ASSETS（原版资源）这几个环境变量，anim extract 按配置传。

["程序"]
"导出模型" = ["uv", "run", "-q", "--with", "pillow", "{脚本}/导出模型.py"]
"导出实体模型" = ["uv", "run", "-q", "--with", "pillow", "{脚本}/导出实体模型.py"]
"网格碎块" = ["uv", "run", "-q", "--with", "numpy", "python", "{脚本}/网格碎块.py"]

# 一组一起跑；另有 --全部
["组"]
"碎块" = ["6-1-5碎块", "6-1-7碎块", "6-1-8碎块", "6-1-8b碎块", "6-3-6震地方块", "6-4-3碎块"]

