"名称" = "门口贴图"
"需要" = ["client-1.20.1"]
"作品" = "把回忆拼好给你"
"公开版" = "提取"
"来源" = "原版 Minecraft 1.20.1"
"许可" = "Mojang EULA"
"步骤" = [
  ["导出模型", "{jar:client-1.20.1}", "src/模型/门口", "橡木告示牌=assets/minecraft/textures/entity/signs/oak.png", "太阳=assets/minecraft/textures/environment/sun.png", "月相=assets/minecraft/textures/environment/moon_phases.png"],
]
["取材"."产物"]
"贴图/物品/橡木告示牌" = "src/模型/门口/橡木告示牌.png"
"贴图/环境/太阳" = "src/模型/门口/太阳.png"
