# 九胡角色包：做九胡的镜头、改模型、补配音时从这里找资产 id 和代码位置。字段见 assets/README.md「角色包」。
"角色" = "九胡"
"别名" = ["酒狐", "酒狐女仆"]
"出场" = "第 6 章起和李樱同行（骑扫帚坐后座、6-2-4 起拿结构指南针导航）"
"说明" = "外形照抄 Yes Steve Model 内置的「大正女仆酒狐」，原型是车万女仆模组的酒狐（第三方角色）：设定图和音色都是私有、许可待定；3D 模型只能从 jar 提取，不进公开仓库"
"渲染代码" = "world/角色/九胡.tsx"
"核对" = "content/核对/角色包（Composition 核对-角色包）：自带嘴、各口型、两人站着说话，10-21 和旧项目同机位静帧逐像素相同（最大差 0）；站、跑、弯腰的骨骼姿势（裙子、尾巴）另按 485 组输入和旧代码逐值比过，完全相同"
# 最小用法：同李樱（ThreeCanvas 里、外面套 <group rotation={[-Math.PI / 2, 0, 0]}>），完整例子见 content/核对/角色包/画面.tsx。
# 公开版不带 模型/角色/九胡、贴图/角色/九胡 的字节（可见性 提取），使用者先按生成链从自己的 jar 导出入库
"用法" = """
import { Jiuhu } from 'world/角色/九胡.tsx';
import { standPose } from 'world/角色/骨架.tsx';
import { runPoseAt } from 'world/角色/跑步.ts';
import { mouthAt } from 'world/角色/口型.ts';

// 站着：tail 是尾巴轻摆的相位（弧度），按帧推进，例如 帧 / 12
<Jiuhu pose={standPose([0, 0, 0])} tail={帧 / 12} />

// 跑：gait 是步态周期数（和 runPoseAt 的 cycles 同一个），run 是跑步权重 0～1（尾巴从轻摆过渡到左右甩）；裙子「反重力」自动跟腿
<Jiuhu pose={runPoseAt([0, 0, 0], 0, 周期, 30)} tail={Math.PI * 周期} gait={周期} run={1} />

// 弯腰喘气：bend 度（上半身连头、手、尾巴一起弯，裙子跟着转一半）
<Jiuhu pose={standPose([0, 0, 0])} tail={帧 / 12} bend={45} />

// 说话：自动藏起平常的 ω 嘴、画会动的嘴；右手 挂在 RightHandLocator 上（指南针等）
<Jiuhu pose={standPose([0, 0, 0])} tail={帧 / 12} 嘴={mouthAt(cue, '九胡', 帧)} 右手={手里的东西} />
"""

