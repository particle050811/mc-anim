# 魔法酒狐角色包：做她的镜头、改模型时从这里找资产 id 和出处。字段见 assets/README.md「角色包」。
"角色" = "魔法酒狐"
"别名" = ["百花仙狐", "winefox_magical"]
"出场" = "隐世之境（万法皆通 maidspell 的结构）里坐着的那只女仆；作品「把回忆拼好给你」在用"
"说明" = "车万女仆 1.5.3 内置的 geckolib 模型「魔法酒狐」，戴贴图 _3（YSM 语言文件里叫百花仙狐，粉色）。游戏里按 maid_model.json 的 render_entity_scale 0.65 缩放，不是九胡的 0.7。模型许可 CC BY-NC-SA 4.0，另禁止色情擦边和血腥内容（TartaricAcid/WineFoxModel 的 README）。3D 模型只能从 jar 提取，不进公开仓库"
"渲染代码" = "库/角色/魔法酒狐.tsx（新表情、新姿势、手里拿东西：库/角色/魔法酒狐新动作组件.tsx、魔法酒狐新动作.ts）"
"核对" = "把回忆拼好给你 的核对段 核对-魔法酒狐：贴图正、背、仰视，坐姿正、侧、背，第一人称（南边 2 格、眼高 1.62）下看向俯仰 0°、15°、30°和看玩家。坐姿和隐世之境游戏截图（数据根 run/extract/隐世之境/ 的 01、03、04，同机位）叠在一起，身高、坐高、背后法杖和三个环、帽檐、贴图细节都对得上（10-22）；逐面 UV 没改写。摘帽（和游戏 05 同机位）、暗处发光开关、站着时法杖浮动和三个环转（0、0.6、1 秒）也在这个核对段里：发光面画出来就是贴图原色，游戏 03 里眼睛三种颜色正好是贴图色乘竖直面的方向光 0.74，眼珠高光（ysmGlow 骨骼的子骨骼）偏暖、不亮，和 TLM 只亮骨骼自己的方块一致（10-22）"
# 最小用法：ThreeCanvas 里、外面套 <group rotation={[-Math.PI / 2, 0, 0]}>（Z 朝上），完整例子见 作品/把回忆拼好给你/核对/魔法酒狐/画面.tsx。
# 公开版不带模型和贴图的字节（可见性 提取），使用者先按生成链从自己的 jar 导出入库
"用法" = """
import { MagicalWineFox, magicalWineFoxLookAt } from '库/角色/魔法酒狐.tsx';
import { standPose } from '库/角色/骨架.tsx';

// 默认就是游戏里平时的样子：坐着、戴魔女帽、背后法杖；pose 的 loc、yaw 定位置和朝向（yaw 180 = 面朝南），头往哪看用 看
const 她 = { ...standPose([0, 0, 0]), yaw: 180 };
<MagicalWineFox pose={她} />

// 抬头：看 = [俯仰, 左右]（度，正 = 抬头、往她自己的左边）；对准玩家眼睛用 magicalWineFoxLookAt
<MagicalWineFox pose={她} 看={magicalWineFoxLookAt(她, [0, -2, 1.62])} />

// 秒：法杖浮动（只有站着浮）、三个环转、摘帽后耳朵抖都按它循环；帽子、背后法杖、发光默认开
<MagicalWineFox pose={她} 秒={frame / fps} 帽子={false} />

// 骨骼：最后整条替换某根骨骼；右手：挂在 RightHandLocator 上的东西
<MagicalWineFox pose={她} 骨骼={{ Tail2: { rot: [-25, 0, 0] } }} 右手={手里的东西} />

// 新表情、新姿势、手里拿东西（库/角色/魔法酒狐新动作组件.tsx，包在 MagicalWineFox 外面，不改它）：
// 姿势 站 坐 蹲 抱膝坐 张望 哈气；表情 认出你 哈气（旧的五种照旧）；看 = 相对身子的 [俯仰, 左右]（左右夹在 ±75°），看向 = 对准场景里一点
import { MagicalWineFoxEx } from '库/角色/魔法酒狐新动作组件.tsx';
import { magicalWineFoxTurnTo } from '库/角色/魔法酒狐新动作.ts';
<MagicalWineFoxEx pose={她} 姿势="哈气" 表情="哈气" 秒={frame / fps} />
// 身子侧着、头转 50° 看镜头；右手拿月铃兰（作品/把回忆拼好给你/物品/月铃兰.tsx），花的正面朝 偏 度（从她正前方往她左边转）
const { yaw } = magicalWineFoxTurnTo(她.loc, 镜头, 50, '左');
<MagicalWineFoxEx pose={{ ...她, yaw }} 姿势="站" 表情="认出你" 看向={镜头} 右手={{ 物品: <月铃兰 />, 朝向: { 偏: 50 } }} />
"""

