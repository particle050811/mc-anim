# 李樱角色包：做李樱的镜头、改模型、补配音时从这里找资产 id 和代码位置。字段见 assets/README.md「角色包」。
# 资产 id 都在 assets/registry/ 里登记，导入工具（assets/tools/导入旧项目.py）会核对这里写的 id 和匹配都找得到。
"角色" = "李樱"
"别名" = ["Li Ying"]
"出场" = "全片主角；第 6 章起漫剧每场都在"
"说明" = "方块人造型（32 像素高），扳手在右手、拔刀剑在左腰。外观以设定图为准，3D 模型由 build_li_ying.py 一份脚本生成，不手改模型数据"
"渲染代码" = "world/角色/李樱.tsx"
"核对" = "content/核对/角色包（Composition 核对-角色包）：站姿正面、斜侧、持刀、嘴型、两人站着说话，10-21 和旧项目同机位静帧逐像素相同（最大差 0）"
# 最小用法：在 ThreeCanvas 里、外面套一层 <group rotation={[-Math.PI / 2, 0, 0]}>（场景坐标 Z 朝上、人朝 +Y、1 = 一格，转成 three 的 Y 朝上）。
# 完整能跑的例子（机位、灯光、色调映射）见 content/核对/角色包/画面.tsx。import 路径按调用处相对写，这里写成从仓库根起
"用法" = """
import { LiYing } from 'world/角色/李樱.tsx';
import { standPose, bladeInHand } from 'world/角色/骨架.tsx';
import { runPoseAt, speedProfile } from 'world/角色/跑步.ts';
import { mouthAt } from 'world/角色/口型.ts';
import { DrawnKatana, WornSheath } from 'world/物品/拔刀剑.tsx';

// 站着，刀挂在左腰（WornSheath 是全片统一的挂法：刃口朝下、鞘尾上翘）
<LiYing pose={standPose([0, 0, 0])} hipL={<WornSheath />} />

// 跑：速度按关键点 [秒, 米/秒] 给，speedProfile 积出跑过的路和步态周期数，runPoseAt 出姿势（步频、步长、前倾跟着速度走）
const 跑 = speedProfile([[0, 0], [0.3, 30]])(秒);
<LiYing pose={runPoseAt([0, 跑.dist, 0], 0, 跑.cycles, 跑.speed)} hipL={<WornSheath />} />

// 右手持出鞘的刀：bladeInHand(姿势, 刀在前后竖直面里的角, 往右偏的角) 把身体坐标里的刀向换到握持点，
// 再绕刀身转 90° 让刃朝外（照 content/核对/角色包 的持刀视图；THREE 即 three）
const 持刀 = { ...standPose([0, 0, 0]), armR: 55, armRRoll: -22, elbowR: 25 };
const 刃朝外 = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), Math.PI / 2);
<LiYing pose={持刀} hipL={<WornSheath sheathed={false} />} handR={<group quaternion={bladeInHand(持刀, 0, 42).multiply(刃朝外)}><DrawnKatana /></group>} />

// 说话：cue = [{ id: 台词id, 帧: 开口帧 }]，没在说话时 mouthAt 返回 undefined、画平常的嘴
<LiYing pose={standPose([0, 0, 0])} 嘴={mouthAt(cue, '李樱', 帧)} />
"""

