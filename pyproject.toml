[project]
name = "mc-anim"
version = "0.1.0"
description = "mc-anim 的 Python 叶子工具：JSON 进，文件和 JSON 出；路径由 anim 传进来，不自己推算"
requires-python = ">=3.11"
# pypinyin 钉版本：口型按拼音拆音素，换版本可能改嘴（第 6、7 章的口型是 0.55.0 算的）；pipeline/配音/python.ts 的 pypinyin版本 要一样
dependencies = ["pypinyin==0.55.0"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff==0.16.10",
]
# anim voice 的本机复核（音色相似度、音高和响度起伏，py/anim_py/配音/复核.py）：要 torch，单独一组，anim 跑复核时才装（uv run --group voice-review）。
# resemblyzer 运行时 import pkg_resources，所以带 setuptools（81 起没有 pkg_resources，钉在 81 以下）。版本照旧项目 参考模型库 voice 组用过的
voice-review = [
    "numpy",
    "librosa",
    "soundfile",
    "praat-parselmouth",
    "resemblyzer==0.1.4",
    "setuptools<81",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["py/anim_py"]

[tool.pytest.ini_options]
testpaths = ["py/tests"]

# anim check 的 Python 检查：ruff 和 pyright 只查自己写的工具（py/、assets/tools/、pipeline/适配器/）；assets/src/ 是资产的生成源（如 build_li_ying.py），原样保存，不查。
# pipeline/适配器/旧项目/ 只过 ruff：它运行时才从旧项目 sys.path 引模块、numpy 由 uv 临时装，pyright 解析不到
[tool.ruff]
target-version = "py311"
line-length = 160
include = ["py/**/*.py", "assets/tools/**/*.py", "pipeline/适配器/**/*.py", "sourcing/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# sourcing/ 的取材脚本照旧项目原样搬（不重排版），只查语法错和 pyflakes 那类真问题
"sourcing/**/*.py" = ["E4", "E7"]
"sourcing/extract/殖民地蓝图.py" = ["E4", "E7", "F401"]

[tool.pyright]
include = ["py", "assets/tools"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
