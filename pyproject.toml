[project]
name = "sr-py"
version = "0.1.0"
description = "stress-rotation 的 Python 叶子工具：JSON 进，文件和 JSON 出；路径由 sr 传进来，不自己推算"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff==0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["py/sr_py"]

[tool.pytest.ini_options]
testpaths = ["py/tests"]

# sr check 的 Python 检查：ruff 和 pyright 只查自己写的工具（py/、assets/tools/）；assets/src/ 是资产的生成源（如 build_li_ying.py），原样保存，不查
[tool.ruff]
target-version = "py311"
line-length = 160
include = ["py/**/*.py", "assets/tools/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
include = ["py", "assets/tools"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
