[project]
name = "sr-py"
version = "0.1.0"
description = "stress-rotation 的 Python 叶子工具：JSON 进，文件和 JSON 出；路径由 sr 传进来，不自己推算"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["py/sr_py"]

[tool.pytest.ini_options]
testpaths = ["py/tests"]
