# 成片规矩表：全片的默认做法只登记在这里。用法和级别的含义见 docs/架构.md「规矩」。
# 每条字段：
#   id      中文短词，代码里 例外('id', 值, {段, 原因}) 用它
#   默认值  数值或一句话；有单位的另写 单位
#   级别    "原话" = 有用户原话，而且原话说的就是这一类情况；其余都是 "参考"（只有日期、原话针对别处、或 Agent 推广的）
#   原话    用户原话，照抄；没有就留空数组
#   针对    原话（或决定）当时说的是哪一处、哪类情况
#   出处    日期 + 提交、文件或记忆名（M/ = agent-context 记忆 projects/stress-rotation-comic/）
#   落点    默认值在代码里的位置。「旧:」开头的是旧项目路径（src/、工具/ 相对 参考模型库/，其余相对旧项目根），搬完改成新路径
#   例外    [{ 段 或 场, 值, 原因, 出处 }]，和代码里的 例外(...) 一一对应
#   可选：单位、说明（默认值是数时的解释）、备注
# 元规则：看过的实现为准；Agent 不得把规矩推广到全片，只能在预览 00-说明.md 提议，用户点头再登记（CLAUDE.md）。
# 中文键要加引号：TOML 1.0 的裸键只认 ASCII（Python tomllib 等按 1.0 解析）。
# 初版由 Agent 按旧 CLAUDE.md「全片通用规矩」和记忆逐条整理（10-21），等用户过目。

# ───────────── 画面：视距、光影、特效 ─────────────

