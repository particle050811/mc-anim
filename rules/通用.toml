# 通用规矩表：各作品都守的规矩。格式和 作品/<名>/规矩.toml 一样（字段说明见 作品/应力转动/规矩.toml 文件头）。
# 规矩先全挂在作品下，升格成通用要用户逐条定，Agent 不自己推广。

[["规矩"]]
id = "自制模型贴图风格"
"默认值" = "自己做的模型、贴图往真实、细腻做：顺滑的几何、真几何的纹样、金属和发光的质感，不故意做成像素方盒、粗颗粒；照李樱的拔刀剑（库/物品/拔刀剑.tsx）那个路子"
"级别" = "原话"
"原话" = ["你这个做的法杖怎么这么粗糙？我的意思是这个像素颗粒感很重。我这个应该是偏向更真实、更细腻的风格，所以没有必要故意搞这么粗糙，包括那个晋升之环", "以后自制的贴图建模也是这样的", "然后像我的那个拔刀剑，也是往真实细腻的方向做的，对吧？"]
"针对" = "亚波伦不放水 重做的下界魔杖三个像素方盒候选（预览 1110-0909）和晋升之环；用户随后说以后自制的贴图、建模都这样（11-10）"
"出处" = ["11-10 会话", "作品/亚波伦不放水/需求.md", "M/render-style-preference.md"]
"落点" = []
"例外" = []
"备注" = "只管自己做的东西。原版、模组的模型贴图照原样用（库/ 的约定），角色本来就是方块风格的头发衣服保持体素（M/render-style-preference.md）"
