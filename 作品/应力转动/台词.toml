# 台词表：说出口的每一句（不用旁白），配音链（anim voice）唯一人写的源。段.ts 的声音 cue 写 { 帧, 台词: '<台词 id>' } 引用（帧是开口那一帧），anim check 核对。
# 每条 [["台词"]]：
#   id        <章>-<角色>-<短名>，章内唯一，和段解耦；不撞 作品/应力转动/旧名.tsv 里的旧台词 id
#   角色      和 id 中间那段一致
#   文本      屏幕上的字，也是配音念的字（念 不写时）
#   念        可选：交给 TTS、对口型的字和 文本 不同时写（读法、外语原文）；只改字幕不改念法时写 念 = 原来的字，配音不算过期
#   语言      可选：中文（不写就是）、日语、英语、粤语
#   语气      可选：这句的情境和语气（挑候选用，能按文字控语气的后端也拿它）
#   字幕位置  下（不写就是）或 思索上（思索界面盖着时字幕挪到上面）
#   未用      true = 不被任何段用（留着备用）；没写的每句恰好在一段开口一次（接着放的后半截 cue 标 接上段，不算）
#   说明      可选
#   ["台词"."合成"]      可选：这句的合成设置，覆盖下面的 ["配音"]、["音色"]：后端、参考、逐字稿、种子、语气参考（资产 id）、强度、不裁、参数
#   ["台词"."口型手修"]  对齐模型对不准时手标每个字的起止：成品sha（对着哪版成品标的，配音一换就作废）、注、字 = [[字, 起秒, 止秒], …]
# 下面几项由 anim voice 写回，不用手填：
#   配音      成品的资产 id（配音/<id>）；还没配音的不写
#   开口      配音文件里第几秒开口（文件头 = cue 帧 − 开口 × fps）
#   文本哈希  配音念的字（念，没写就是文本）的 sha256 前 12 位；念的字改了对不上，就是配音过期
#   成品sha   配音成品的 sha256 前 12 位，要和资产锁一致；换了配音不改这里就报
#   口型      { "成品sha" = … }：句模块（台词/<id>.ts，口型和测量）是对着哪版成品做的
# 新加一句：写 id、角色、文本（和 语气）→ anim voice gen <id> 出候选 → 试听 → anim voice use <id> <候选.wav> 定稿；段里 import 台词/<id>.ts 拿口型（见 docs/架构.md「配音」）。
# 中文键要加引号（TOML 1.0 的裸键只认 ASCII）。第 6、7 章的台词照基线 _表/台词落点.json、旧 参考模型库/src/配音/台词表.json 登记（旧 id 换新 id 见 作品/应力转动/旧名.tsv）；
# 语气、念、口型手修 搬自旧 台词表.json、口型手修.json。

# 全作品的配音默认：后端（anim voice backends 看有哪些）、每句出几个候选的种子、成品响度和峰值、新配音登记的许可
["配音"]
"后端" = "firered-本机"
"种子" = [1234, 20261010, 7, 42]
"目标响度" = -18.0
"峰值上限" = -1.5
"许可" = "LicenseRef-待定"

# 各角色的克隆参考：参考 = 音色资产 id，逐字稿 = 参考音频里说的话（出处 assets/src/角色/<角色>/参考音频.txt、作品/应力转动/资产源/角色/<角色>/参考音频.txt 第一行）
