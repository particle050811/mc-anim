"level" = "原话"
"quotes" = ["视距怎么这么抠门"]
"appliesTo" = "古城远看一片灰（10-18）；10-19 古城、6-3 地下远处露底"
"provenance" = ["旧 CLAUDE.md 全片通用规矩（用户 10-18、10-19）", "0dc6e42a", "87870b1a", "M/render-style-preference.md"]
"placement" = ["engine/voxel/视距.ts VIEW_DISTANCE、VIEW_FOG", "作品/应力转动/地点/古城4x.tsx FOG_4X"]
"exceptions" = []
"remark" = "推广到古城以外的所有场景是 Agent 写进旧 CLAUDE.md 的。暮色高空、飞行段的远雾另用 engine/light/暮色光照.tsx 的 TWILIGHT_CRUISE_FOG_FAR（3500）、TWILIGHT_EDGE_FOG_MIN（900），6-起飞、6-穿塔斩首领 再按「暮色超远景雾」放到 10 公里，不算例外"

