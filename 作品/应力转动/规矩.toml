"defaultValue" = "4K60 出：3840×2160、原生 60 帧（画面按秒算、每个输出帧现算，不按 24 帧编排再缩放；声音和画面同一遍出，cue 按秒落），x264 medium CRF 18、码率上限 40 Mbps（VBV，缓冲 80M），BT.709 标签；每段渲出来就是成片的一截（叠层、字幕画在段里），成片只接不重压；字幕用游戏像素字烧进画面。1080P60 可选（1920×1080、上限 15 Mbps）"
"level" = "原话"
"quotes" = ["原生4K", "段文件加上限 不过用 40mbps 稍微高点吧  1080P60 只是可选项 默认 4K60", "成品颜色标签改成规范的", "改成 60 帧", "母版分辨率肯定要改成和发布版一致的", "CRF 16 medium 好的 那就用这个吧 后面给出的那个正式发布版 也用 medium", "我都说了要原生 60 FPS，你不要搞什么快进缩放 2.5 倍……你直接原生 60 FPS，直接渲染对应的音频不就好了吗？", "这种写法（按帧号写）兼容性比较差，不应该都是按函数那种写的吗？"]
"appliesTo" = "交付成片（10-15 硬件 q38，11-01 改 medium，11-04 按 B 站 1080P60、AV1；11-05 用户改定 4K60、段直接压成成片、x264 加 40 Mbps 上限；11-06 用户定原生 60 帧、不要编排时钟的 2.5 倍缩放。CRF 18、1080P60 的 15 Mbps 是 Agent 实测定的，用户没点这两个数）"
"provenance" = ["用户 11-06", "docs/决策/0015-原生60帧.md", "用户 11-05", "预览/1105-1514-出片流程重做方案", "用户 11-04", "用户 11-01", "用户 10-15", "M/review-folder-preference.md", "M/optimization-storage.md"]
"placement" = ["pipeline/渲/设置.ts filmTierTable、renderParams", "pipeline/出片/拼成片.ts assembleFilm", "engine/段/出帧.ts filmStartFrameTable", "engine/段/时间.tsx useCurrentSec"]
"remark" = "11-05 前的说法（AV1 CRF 30 不卡码率，用户当时说「卡码率是很傻逼的行为」「都删掉 不留这个选项」）被同一天的 4K60 + 40 Mbps 上限取代：那次删的是整片压缩的码率上限，这次是用户点名在段文件上加回"
"exceptions" = []

