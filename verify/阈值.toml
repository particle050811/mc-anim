# sr verify 的阈值。现在是占位值：M0 量过同一段在本机重渲两次的噪声底后再定。
# 帧：哈希一样就是没变；不一样时有认可那版的母版就逐像素比，没有就只比 16×9 块均值。
"像素容差" = 2           # 单个像素 RGB 任一通道差不超过这个（0–255）算没变
"差像素占比" = 0.0005    # 超过像素容差的像素占比不超过这个，这一帧算没变
"块均值容差" = 1         # 只能比块均值时，每块每个通道差不超过这个算没变
# 声音：sha 一样就是没变；不一样时新旧 PCM 逐采样相减，残差的 RMS 低于这个算没变
"音频残差dBFS" = -90
