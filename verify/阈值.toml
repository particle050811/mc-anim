# anim verify 的阈值。用户 10-21 定：成片不要差太多就行，不要求逐像素、逐样本相同；只修看得出来的差。
# 帧：哈希一样就是没变；不一样时有旧那版的像素（认可参考、认可那版的母版、旧项目基线 PNG）就比块平均差，没有就只比 16×9 块均值。
#   块平均差（用户 11-02 定换，预览 1102-1143-verify比法）：两边都由 YUV 按固定公式换 RGB，d = 新 − 旧，
#   w×w 窗口（左上角在 4 像素网格上、步长 4）里各通道 d 的平均取绝对值、三通道取最大，全帧最大的那个窗口的值（级，0–255）。
#   实测（数据根 archive/verify比法-1102/，重跑见同目录 重跑-新解法/）：内容没变、字节不同的帧 16×16 最高 8.77、64×64 最高 2.5、8×8 最高 16.8；
#   真改动 16×16 最低 11.2（6-羊毛搜刮第 48 帧一块 25×25 的方块）。
"块16门槛" = 10         # 16×16 块平均差超过这个判变了
"块64门槛" = 4          # 64×64 块超过这个判变了（抓雾、光照、云色这类整片轻微变化）；用 4 不用 3 是 Agent 定的，用户没点：离噪声最高 2.5 更远
"块8门槛" = 24          # 8×8 块超过这个判变了（抓「字少一笔」这类小改动）
"看一眼门槛" = 6        # 16×16 在这个和 块16门槛 之间：不判失败，出 旧|新|差 并排图给人看
"块均值容差" = 1        # 只能比 16×9 块均值时（也用于段签自查重渲漂移），每块每个通道差不超过这个算没变
# 声音：sha 一样就是没变；不一样时比整段积分响度和起音落点（台词、音效开始的时刻）
"响度容差LU" = 0.5
"起音容差帧" = 1
