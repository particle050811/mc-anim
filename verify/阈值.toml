# sr verify 的阈值。用户 10-21 定：成片不要差太多就行，不要求逐像素、逐样本相同；只修看得出来的差。
# 帧：哈希一样就是没变；不一样时有旧那版的像素（认可那版的母版、旧项目基线 PNG）就逐像素比，没有就只比 16×9 块均值。
#   数据根 基线/底噪.md：同一提交渲两遍，差 > 16/255 的像素一帧最多占 3.8e-6；真改过画面的段一帧在 2%～31%。
"差像素门槛" = 16       # 单个像素 RGB 任一通道差超过这个（0–255）算这个像素有差
"差像素占比" = 1e-3     # 一帧里有差的像素占比不超过这个算过；超了出 旧|新|差 并排图给人看
"块均值容差" = 1        # 只能比块均值时，每块每个通道差不超过这个算没变
# 声音：sha 一样就是没变；不一样时比整段积分响度和起音落点（台词、音效开始的时刻）
"响度容差LU" = 0.5
"起音容差帧" = 1
